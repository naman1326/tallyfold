AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tallyfold Secure Production API Proxy for AWS Amplify Hosting

Parameters:
  ApiBase:
    Type: String
    Default: 'https://vec4q0sqc9.execute-api.eu-north-1.amazonaws.com/prod'
    Description: Base URL of the existing API Gateway REST API (including /prod stage).
  AllowedOrigin:
    Type: String
    Default: 'https://main.d7hymcw027vmv.amplifyapp.com'
    Description: The exact origin of the deployed Amplify frontend app. No wildcards.
  ProxySecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional shared access token (x-proxy-secret) to restrict Function URL calls to authorized Amplify rewrites / reverse proxies. Keep empty for standard Amplify rewrites.
  ApiKeyParameterName:
    Type: String
    Default: '/expense/proxy/api_key'
    Description: SSM Parameter Store SecureString parameter name for the API Gateway API key.
  ReviewTokenParameterName:
    Type: String
    Default: '/expense/proxy/review_token'
    Description: SSM Parameter Store SecureString parameter name for the review token.

Resources:
  TallyfoldApiProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tallyfold-api-proxy
      Handler: handler.handler
      Runtime: nodejs24.x
      CodeUri: .
      MemorySize: 256
      Timeout: 15
      Policies:
        - Statement:
            - Sid: AllowSSMGetParameter
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:eu-north-1:${AWS::AccountId}:parameter/expense/proxy/api_key'
                - !Sub 'arn:aws:ssm:eu-north-1:${AWS::AccountId}:parameter/expense/proxy/review_token'
            - Sid: AllowS3GetReceiptObject
              Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - 'arn:aws:s3:::receipts-510821108145-us-east-1/*'
      # Note on AuthType: NONE is used because static frontend SPAs on Amplify Hosting
      # run directly in browser clients and cannot sign requests with AWS IAM (SigV4)
      # without a complete Cognito Identity Pool & STS authentication stack.
      # Access is protected via:
      # 1) Strict endpoint & HTTP method whitelisting (GET /expenses, POST /upload, POST /review).
      # 2) Strict CORS origin lockdown to the Amplify app domain (AllowedOrigin).
      # 3) Optional shared secret verification header (ProxySecret).
      # 4) Complete server-side isolation: secrets fetched at runtime from SSM Parameter Store.
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          # Note: SAM and CloudFormation reject 'OPTIONS' in AllowMethods.
          # Function URLs handle preflight OPTIONS automatically based on configured methods/origins.
          AllowMethods:
            - GET
            - POST
          AllowHeaders:
            - Content-Type
            - Authorization
            - x-api-key
            - x-review-token
            - x-proxy-secret
            - x-amz-meta-*
          MaxAge: 86400
      Environment:
        Variables:
          API_BASE: !Ref ApiBase
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          PROXY_SECRET: !Ref ProxySecret
          API_KEY_PARAM_NAME: !Ref ApiKeyParameterName
          REVIEW_TOKEN_PARAM_NAME: !Ref ReviewTokenParameterName
          RECEIPTS_BUCKET: 'receipts-510821108145-us-east-1'

Outputs:
  ProxyFunctionUrl:
    Description: Public Lambda Function URL to target in Amplify Rewrites or VITE_API_BASE
    Value: !GetAtt TallyfoldApiProxyFunctionUrl.FunctionUrl
