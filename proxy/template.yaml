AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tallyfold Secure Production API Proxy for AWS Amplify Hosting

Parameters:
  ApiBase:
    Type: String
    Default: 'https://vec4q0sqc9.execute-api.eu-north-1.amazonaws.com/prod'
    Description: Base URL of the existing API Gateway REST API (including /prod stage).
  ApiKey:
    Type: String
    NoEcho: true
    Description: Secret API key for API Gateway (injected server-side as x-api-key).
  ReviewToken:
    Type: String
    NoEcho: true
    Description: Secret review token for POST /review approvals (injected server-side as x-review-token).
  AllowedOrigin:
    Type: String
    Default: 'http://localhost:5173'
    Description: The exact origin of the deployed Amplify frontend app (e.g. https://main.d123456789.amplifyapp.com). No wildcards.
  ProxySecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional shared access token (x-proxy-secret) to restrict Function URL calls to authorized Amplify rewrites / reverse proxies.

Resources:
  TallyfoldApiProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tallyfold-api-proxy
      Handler: handler.handler
      Runtime: nodejs24.x
      CodeUri: .
      MemorySize: 256
      Timeout: 15
      # Note on AuthType: NONE is used because static frontend SPAs on Amplify Hosting
      # run directly in browser clients and cannot sign requests with AWS IAM (SigV4)
      # without a complete Cognito Identity Pool & STS authentication stack.
      # Access is protected via:
      # 1) Strict endpoint & HTTP method whitelisting (GET /expenses, POST /upload, POST /review).
      # 2) Strict CORS origin lockdown to the Amplify app domain (AllowedOrigin).
      # 3) Optional shared secret verification header (ProxySecret).
      # 4) Complete server-side isolation of API_KEY and REVIEW_TOKEN.
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          # Note: SAM and CloudFormation reject 'OPTIONS' in AllowMethods.
          # Function URLs handle preflight OPTIONS automatically based on configured methods/origins.
          AllowMethods:
            - GET
            - POST
          AllowHeaders:
            - Content-Type
            - Authorization
            - x-api-key
            - x-review-token
            - x-proxy-secret
            - x-amz-meta-*
          MaxAge: 86400
      Environment:
        Variables:
          API_BASE: !Ref ApiBase
          API_KEY: !Ref ApiKey
          REVIEW_TOKEN: !Ref ReviewToken
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          PROXY_SECRET: !Ref ProxySecret

Outputs:
  ProxyFunctionUrl:
    Description: Public Lambda Function URL to target in Amplify Rewrites or VITE_API_BASE
    Value: !GetAtt TallyfoldApiProxyFunctionUrl.FunctionUrl
